name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The tag name is untrusted text: it reaches the script and gh only through the
      # environment, and the script accepts it only when it equals v + the manifest version.
      - name: Read release notes from CHANGELOG.md
        env:
          TAG: ${{ github.ref_name }}
        run: python3 tools/release_notes.py "$TAG" > "$RUNNER_TEMP/release-notes.md"
      - name: Create the GitHub release
        env:
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$TAG" --verify-tag --title "$TAG" --notes-file "$RUNNER_TEMP/release-notes.md"

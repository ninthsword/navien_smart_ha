name: security-policy

on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited, ready_for_review]

permissions:
  contents: read
  statuses: read
  pull-requests: read

jobs:
  policy-guard:
    runs-on: ubuntu-latest
    steps:
      # pull_request_target uses this workflow from the trusted default branch. Do not set ref:
      # checking out or executing PR content here would defeat the policy boundary.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Reject pull requests that weaken security policy
        id: owner_policy_guard
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EXPECTED_BASE_BRANCH: ${{ github.event.pull_request.base.ref }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 -I -S -B .github/security/owner-policy-guard.py

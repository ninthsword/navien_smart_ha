name: security-policy

on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited, ready_for_review]

permissions:
  contents: read

jobs:
  policy-guard:
    runs-on: ubuntu-latest
    steps:
      # pull_request_target uses this workflow from the trusted base branch. Do not set ref:
      # checking out or executing PR content here would defeat the policy boundary.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Reject pull requests that weaken security policy
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          git cat-file -e "${BASE_SHA}^{commit}"
          git fetch --no-tags origin "refs/pull/${PR_NUMBER}/head"
          fetched_sha="$(git rev-parse FETCH_HEAD)"
          if [ "${fetched_sha}" != "${HEAD_SHA}" ]; then
            echo "Fetched pull request head does not match the event head."
            exit 1
          fi

          protected_paths='(^|/)(\.gitleaksignore|\.gitleaks\.toml|\.semgrepignore)$|^\.github/workflows/'
          protected_paths_file="$(mktemp)"
          trap 'rm -f -- "${protected_paths_file}"' EXIT
          if ! git diff --no-renames --name-only -z "${BASE_SHA}" "${HEAD_SHA}" >"${protected_paths_file}"; then
            echo "Could not enumerate pull request paths."
            exit 1
          fi
          protected_path_found=0
          while IFS= read -r -d '' changed_path; do
            if [[ "${changed_path}" =~ ${protected_paths} ]]; then
              protected_path_found=1
              break
            fi
          done <"${protected_paths_file}"
          if [ "${protected_path_found}" -eq 1 ]; then
            echo "Pull requests may not modify security policy files."
            exit 1
          fi

          if ! git diff --patch --unified=0 --output-indicator-new='>' "${BASE_SHA}" "${HEAD_SHA}" >"${protected_paths_file}"; then
            echo "Could not enumerate pull request patch."
            exit 1
          fi
          if grep -Ei '^>.*(gitleaks:allow|nosemgrep|nosem)([^[:alnum:]_]|$)' "${protected_paths_file}" > /dev/null; then
            echo "Pull requests may not add inline scanner-suppression markers."
            exit 1
          else
            grep_status=$?
            if [ "${grep_status}" -ne 1 ]; then
              echo "Could not inspect pull request patch."
              exit 1
            fi
          fi

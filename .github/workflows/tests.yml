name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  fast-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: python3 tests/run.py

  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.5"
      - run: uvx --from ruff==0.16.4 ruff check custom_components tests tests_ha tools

  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: home-assistant/actions/hassfest@a7c616ce81ccda50150bf1595786c71b1883fabb

  home-assistant-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.5"
          enable-cache: true
      - run: uv venv --python python
      - run: uv pip sync --python .venv/bin/python --require-hashes requirements-dev.lock
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: devtools/pyright/package-lock.json
      - run: npm ci --prefix devtools/pyright --ignore-scripts --no-audit --no-fund
      - name: Pyright for all maintained Python
        run: devtools/pyright/node_modules/.bin/pyright --project pyrightconfig.json --pythonpath .venv/bin/python --outputjson
      - name: Strict mypy against Home Assistant 2026.8
        run: .venv/bin/mypy custom_components/navien_smarthome
      - name: Home Assistant 2026.8 contract tests
        run: .venv/bin/pytest --log-disable=sqlalchemy.engine.Engine

  home-assistant-2026-9:
    name: Home Assistant 2026.9.2 compatibility
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.14.7'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install locked compatibility dependencies
        run: |
          python -m pip install uv==0.12.5
          uv venv --python 3.14.7 .venv-ha2026.9
          uv pip sync --python .venv-ha2026.9/bin/python --require-hashes requirements-ha2026.9.lock
          npm ci --prefix devtools/pyright --ignore-scripts --no-audit --no-fund
      - name: Check installed core version
        run: .venv-ha2026.9/bin/python -c 'from importlib.metadata import version; assert version("homeassistant") == "2026.9.2"'
      - name: Check compatibility types
        run: |
          devtools/pyright/node_modules/.bin/pyright --project pyrightconfig.json --pythonpath .venv-ha2026.9/bin/python
      - name: Run offline and real Home Assistant tests in separate processes
        run: |
          .venv-ha2026.9/bin/python -B tests/run.py
          .venv-ha2026.9/bin/python -B -m pytest -p no:cacheprovider --log-disable=sqlalchemy.engine.Engine tests_ha
      - name: Lint compatibility sources
        run: .venv-ha2026.9/bin/ruff check --no-cache custom_components tests tests_ha tools
      - name: Check integration types against Home Assistant 2026.9
        run: .venv-ha2026.9/bin/mypy --cache-dir=/dev/null custom_components

  home-assistant-2026-10:
    name: Home Assistant 2026.10.0 compatibility
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.14.7'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install locked compatibility dependencies
        run: |
          python -m pip install uv==0.12.5
          uv venv --python 3.14.7 .venv-ha2026.10
          uv pip sync --python .venv-ha2026.10/bin/python --require-hashes requirements-ha2026.10.lock
          npm ci --prefix devtools/pyright --ignore-scripts --no-audit --no-fund
      - name: Check stable core and exact dependency metadata
        run: |
          .venv-ha2026.10/bin/python -B - <<'PYTHON'
          from importlib.metadata import distributions, version, PackageNotFoundError
          import sys
          from packaging.requirements import Requirement
          from packaging.utils import canonicalize_name

          EXPECTED = ("pytest-homeassistant-custom-component", "homeassistant==2026.10.0b4", "2026.10.0")
          def validate(core, plugin, python, issues):
              assert core == "2026.10.0", core
              assert plugin == "0.13.370", plugin
              assert python == (3, 14, 7), python
              assert issues == [EXPECTED], issues

          issues = []
          for dist in distributions():
              for raw in dist.requires or []:
                  requirement = Requirement(raw)
                  if requirement.marker is not None and not requirement.marker.evaluate({"extra": ""}):
                      continue
                  try:
                      installed = version(requirement.name)
                  except PackageNotFoundError:
                      installed = "MISSING"
                  if installed == "MISSING" or installed not in requirement.specifier:
                      issues.append((canonicalize_name(dist.metadata["Name"]), str(requirement), installed))
          validate(version("homeassistant"), version("pytest-homeassistant-custom-component"), sys.version_info[:3], sorted(issues))
          print("Stable HA environment verified; only the exact plugin beta metadata mismatch is accepted")
          PYTHON
      - name: Prepare stable HA typing exports
        run: |
          .venv-ha2026.10/bin/python -B devtools/ha2026_10_typing.py
          .venv-ha2026.10/bin/python -B -m unittest discover -s devtools -p test_ha2026_10_typing.py -v
      - name: Check compatibility collection, types, tests, and lint
        run: |
          .venv-ha2026.10/bin/python -B -m pytest --collect-only -p no:cacheprovider --disable-socket --allow-unix-socket --log-disable=sqlalchemy.engine.Engine tests_ha
          devtools/pyright/node_modules/.bin/pyright --project pyrightconfig.json --pythonpath .venv-ha2026.10/bin/python
          .venv-ha2026.10/bin/python -B tests/run.py
          .venv-ha2026.10/bin/python -B -m pytest -p no:cacheprovider --disable-socket --allow-unix-socket --log-disable=sqlalchemy.engine.Engine tests_ha
          .venv-ha2026.10/bin/ruff check --no-cache custom_components tests tests_ha tools
          .venv-ha2026.10/bin/mypy --cache-dir=/dev/null custom_components
      - name: Check typing preparation tools
        run: |
          devtools/pyright/node_modules/.bin/pyright --project pyrightconfig.json --pythonpath .venv-ha2026.10/bin/python devtools/ha2026_10_typing.py devtools/test_ha2026_10_typing.py
          .venv-ha2026.10/bin/ruff check --no-cache devtools/ha2026_10_typing.py devtools/test_ha2026_10_typing.py
